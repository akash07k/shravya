name: build addon

on:
  push:
    tags: ["*", "!resources"]
    # To build on main/master branch, uncomment the following line:
    # branches: [ main , master ]

  pull_request:
    branches: [ main, master ]

  workflow_dispatch:
  workflow_call:

jobs:
  build:
    # Building the add-on template as an add-on does not make sense (and fails).
    # Do not modify this repo name with your own one! (should remain the template)
    if: github.repository != 'nvaccess/addonTemplate' && github.ref != 'refs/tags/resources'

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: Checkout NVDA type-check reference
      uses: actions/checkout@v7
      with:
        repository: nvaccess/nvda
        ref: 067456dea8f92fe6a11012cf8c7cf8638b25782e
        path: nvda
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v10.4.0
      with:
        enable-cache: true
    - name: Install dependencies
      run: |
        sudo apt-get update  -y
        sudo apt-get install -y gettext
        uv sync

    - name: Code checks
      run: export PREK_SKIP=no-commit-to-branch; uv run prek run --all-files

    - name: Build-version tests
      run: uv run --no-sync python -B -m unittest discover -s tests

    - name: Build tagged add-on
      if: ${{ startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/tags/resources' }}
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        release_version="${RELEASE_TAG#v}"
        uv run --no-sync python -c \
          'import buildVars, sys; buildVars.validateReleaseTagVersion(sys.argv[1])' \
          "$release_version"
        catalog_url="$(uv run --no-sync python -B addon/synthDrivers/shravya/_delivery_config.py \
          addon/synthDrivers/shravya/config.toml)"
        uv run --no-sync scons "version=$release_version"
        uv run --no-sync python -B tools/build_update_manifest.py \
          "$release_version" changelog.md dist/shravya-update.toml --resource-catalog "$catalog_url"

    - name: Build add-on
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      run: uv run --no-sync scons

    - name: Build translation template
      run: uv run --no-sync scons pot

    - uses: actions/upload-artifact@v7
      with:
        name: packaged_addon
        path: |
          ./dist/*.nvda-addon
        archive: false

    - uses: actions/upload-artifact@v7
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      with:
        path: ./dist/shravya-update.toml
        if-no-files-found: error
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        name: translation_template
        path: |
          ./*.pot
        archive: false

  upload_release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/tags/resources' }}
    needs: ["build"]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: true
    - name: Display structure of downloaded files
      run: ls -R
    - name: Calculate sha256
      run: |
        echo -e "\nSHA256: " >> changelog.md
        sha256sum dist/*.nvda-addon >> changelog.md

    - name: Verify published resources
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        catalog_url="$(python addon/synthDrivers/shravya/_delivery_config.py addon/synthDrivers/shravya/config.toml)"
        python tools/check_release_catalog.py "$catalog_url" "${RELEASE_TAG#v}"

    - name: Protect published releases
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        status="$(curl --silent --show-error --output "$RUNNER_TEMP/shravya-release.json" \
          --write-out '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
          -H 'Accept: application/vnd.github+json' \
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
        case "$status" in
          404) ;;
          200) jq -e '.draft == true' "$RUNNER_TEMP/shravya-release.json" > /dev/null || {
            echo "Release is already published; refusing to change it back to a draft." >&2
            exit 1
          } ;;
          *) echo "Could not check the existing release (HTTP $status)." >&2; exit 1 ;;
        esac

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          dist/*.nvda-addon
          dist/*.pot
          dist/shravya-update.toml
        body_path: changelog.md
        fail_on_unmatched_files: true
        draft: true
        prerelease: ${{ contains(github.ref, '-') }}
